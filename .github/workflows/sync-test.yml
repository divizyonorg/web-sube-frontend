name: Dev → Test → Preprod Otomatik Sync

# Development'a her push geldiğinde Test ve Preprod branch'leri ezilir
on:
  push:
    branches:
      - Development

jobs:
  sync:
    name: Test ve Preprod'u Development ile güncelle
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Test branch'ini Development ile ezip güncelle
        run: git push origin Development:Test --force

      - name: Preprod branch'ini Development ile ezip güncelle
        run: git push origin Development:Preprod --force
