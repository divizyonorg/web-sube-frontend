name: Dev → Test Otomatik Sync

# Development'a her push geldiğinde Test branch'i ezilir
on:
  push:
    branches:
      - Development

jobs:
  sync:
    name: Test'i Development ile güncelle
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test branch'ini Development ile ezip güncelle
        run: git push origin Development:Test --force
