name: Dev → Test → Preprod Otomatik Sync

# Development'a her push geldiğinde Test ve Preprod branch'leri ezilir
on:
  push:
    branches:
      - Development

jobs:
  sync:
    name: Test ve Preprod'u Development ile güncelle
    runs-on: ubuntu-latest
    steps:
      - name: Test branch'ini Development SHA ile güncelle
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/refs/heads/Test \
            -d "{\"sha\": \"${{ github.sha }}\", \"force\": true}"

      - name: Preprod branch'ini Development SHA ile güncelle
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/refs/heads/Preprod \
            -d "{\"sha\": \"${{ github.sha }}\", \"force\": true}"
