name: E2E Canli Site Testleri

on:
  push:
    branches: [Development, Preprod]
  pull_request:
    branches: [Preprod]
  schedule:
    # Her gün saat 06:00 UTC (09:00 Türkiye)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Playwright tarayıcılarını yükle
        run: npx playwright install chromium --with-deps

      - name: Auth state oluştur
        run: |
          mkdir -p tests/.auth
          echo '${{ secrets.PLAYWRIGHT_AUTH_STATE }}' > tests/.auth/state.json

      - name: E2E testleri çalıştır
        run: npx playwright test
        env:
          CI: true
          BASE_URL: https://websube.divizyon.org

      - name: HTML raporu artifact olarak yükle
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
